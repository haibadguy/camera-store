# =============================================================================
# BẢNG MÃ ỐNG SONY (SEL / SELP / SAL) -> KHUNG (nội dung 3, Red Team T2)
# =============================================================================
# Đọc bởi: ai/pipeline/mount_detect.py (hàm lens_khung, nhánh ống Sony)
# Kiểm nguồn và câu trích: ai/survey/content3/check_rule_sources.py
#
# VÌ SAO CÓ BẢNG NÀY
#   Mã SEL / SAL KHÔNG cho biết khổ: SEL85F18 là FE 85mm (full-frame), SEL35F18 là E 35mm (APS-C);
#   SAL85F28 là ống full-frame, SAL16105 là ống DT (APS-C). v0.4 đoán khổ theo mã (SEL -> APS-C, SAL -> FF) nên sai 3 ống
#   và làm 9 ống mất thông tin khung (log ai/data/survey/run_redteam_n3_t2.log).
#
# CÁCH DÙNG (ống có tiêu đề mở đầu bằng "Sony", ngàm sony_e / sony_a)
#   1. Ưu tiên chữ trong phần đầu tiêu đề: "FE" -> ff; "DT", "E <tiêu cự>", "APS-C" -> apsc
#      (căn cứ: sony_e_apsc 'Lens names start with FE / E', sony_dt; xem mount_rules.toml).
#   2. Tiêu đề không có các chữ đó -> tra mã trong bảng dưới.
#   3. Có mã mà mã không có trong bảng -> khung "khong_ro" (không đoán).
#
# PHẠM VI: chỉ các mã có trong dữ liệu (27.940 sản phẩm sau k-core) mà tiêu đề không có chữ FE / DT / E / APS-C
#   (13 mã, 16 ống; đếm bằng ai/survey/content3/check_rule_sources.py, mục 4). Mã có trong dữ liệu nhưng tiêu đề đã có chữ
#   (vd SEL24240 "FE 24-240mm") không cần bảng.
#
# NGUỒN: trang thông số (spec.html) của từng ống trên sony.jp, mục 対応撮像画面サイズ ("cỡ cảm biến tương ứng"):
#   "35mmフルサイズ" = full-frame 35mm; "APS-Cサイズ" / "APS-Cフォーマット専用" = cỡ APS-C / chỉ dành cho APS-C.
#   Các trang Sony bản tiếng Anh (sony.com, sony.ca, sony.co.uk, sony.ie, sony-asia.com, sony.com.tw, electronics.sony.com)
#   trả 403 với curl ngày 08/10/2026; sony.jp cho tải. Trang mã hóa Shift_JIS; html_to_text.py đọc theo thẻ meta charset.
#   Bản sao ở ai/data/external/rule_sources/qd415/sony_jp/ (không lên git), curl ngày 08/10/2026.
#   3 ống G ngàm A (SAL70200G / SAL70300G / SAL70400G) nằm ở mục lưu trữ (/archive/) của sony.jp: trang chỉ ghi tên ống,
#   không ghi mã (型名); mã chỉ có trong URL.
# =============================================================================


[sources.sigma_dc]
url = "https://www.sigma-global.com/en/lenses/17_50_28"
kiem_chung = "da_doc_trang"
trich = "Available mounts: SIGMA SA-mount, Canon EF mount, Nikon F mount, ... DC lenses have an image circle that covers APS-C size image sensors. Not for use on digital cameras having image sensors larger than APS-C size ... as vignetting will occur."
ghi_chu = "Xác nhận luôn: ống DC bản Canon dùng ngàm EF (không phải EF-S) — điểm 'chưa đối chiếu' của QĐ 8 đã có nguồn."

# =============================================================================
# LUẬT RIÊNG (đặt trước luật chung)
# =============================================================================

# ---------------- Canon EF / EF-S (DSLR) ----------------
[[rule]]
id = "canon_efs_on_ef_body"
body_mount = "canon_ef"
body_khung = "*"
lens_mount = "canon_efs"
lens_khung = "*"
level = "incompatible"
source = "canon_efs"
kiem_chung = "da_doc_trang"
note = "Ống EF-S không lắp được thân chỉ có ngàm EF (FF 5D/6D/1D X, APS-H 1D Mk I-IV, APS-C đời đầu 10D/D30/D60): phần sau ống chạm gương."

[[rule]]
id = "canon_ef_apsc_on_ef_ff_body"
body_mount = "canon_ef"
body_khung = ["ff", "khac"]
lens_mount = "canon_ef"
lens_khung = ["apsc", "khong_ro"]
level = "unknown"
source = "sigma_dc"
kiem_chung = "quyet_dinh_nhom"
note = "QĐ 8 (07/10): ống APS-C hãng thứ ba ngàm EF (Sigma DC, Tamron Di II...) trên thân Canon FF/APS-H lắp vật lý được nhưng tối góc, DSLR Canon FF không tự cắt khung; Sigma ghi 'not for use' trên cảm biến lớn hơn APS-C. khong_ro cũng xếp unknown vì không biết vòng ảnh."

[[rule]]
id = "canon_ef_efs_on_efs_body"
body_mount = "canon_efs"
body_khung = "*"
lens_mount = ["canon_ef", "canon_efs"]
lens_khung = "*"
level = "compatible_with"
source = "canon_efs"
kiem_chung = "da_doc_trang"
note = "Thân Canon APS-C có ngàm EF-S nhận cả ống EF và EF-S."

# ---------------- Canon RF / RF-S ----------------
[[rule]]
id = "canon_rfs_on_rf_ff"
body_mount = "canon_rf"
body_khung = "ff"
lens_mount = "canon_rf"
lens_khung = "apsc"
level = "crops_sensor"
source = "canon_rfs"
kiem_chung = "da_doc_trang"
note = "Thân RF full-frame tự chuyển sang cắt 1.6x khi gắn ống RF-S."

[[rule]]
id = "canon_ef_efs_on_rf_adapter"
body_mount = "canon_rf"
body_khung = "*"
lens_mount = ["canon_ef", "canon_efs"]
lens_khung = "*"
level = "requires_adapter"
source = "canon_ef_eos_r"
kiem_chung = "da_doc_trang"
note = "Mount Adapter EF-EOS R cho phép dùng ống EF và EF-S trên thân EOS R (ống EF-S: máy tự cắt khung)."

# ---------------- Canon EF-M ----------------
[[rule]]
id = "canon_ef_efs_on_efm_adapter"
body_mount = "canon_efm"
body_khung = "*"
lens_mount = ["canon_ef", "canon_efs"]
lens_khung = "*"
level = "requires_adapter"
source = "canon_ef_eos_m"
kiem_chung = "da_doc_trang"
note = "Mount Adapter EF-EOS M cho phép dùng ống EF và EF-S trên thân EOS M."

# ---------------- Nikon ----------------
[[rule]]
id = "nikon_dx_on_fx_f"
body_mount = "nikon_f"
body_khung = "ff"
lens_mount = "nikon_f"
lens_khung = "apsc"
level = "crops_sensor"
source = "nikon_dx_fx"
kiem_chung = "da_doc_trang"
note = "Ống DX trên thân FX: máy dùng chế độ cắt DX (tự động với ống DX của Nikon; ống DX hãng thứ ba có thể phải chọn tay)."

[[rule]]
id = "nikon_dx_on_fx_z"
body_mount = "nikon_z"
body_khung = "ff"
lens_mount = "nikon_z"
lens_khung = "apsc"
level = "crops_sensor"
source = "nikon_z_area"
kiem_chung = "da_doc_trang"
note = "Ống Z DX trên thân Z FX: tự chọn vùng ảnh DX."

[[rule]]
id = "nikon_f_on_z_adapter"
body_mount = "nikon_z"
body_khung = "*"
lens_mount = "nikon_f"
lens_khung = "*"
level = "requires_adapter"
source = "nikon_ftz"
kiem_chung = "da_doc_trang"
note = "Mount Adapter FTZ / FTZ II: ống ngàm F trên thân Z."

[[rule]]
id = "nikon_f_on_1_adapter"
body_mount = "nikon_1"
body_khung = "*"
lens_mount = "nikon_f"
lens_khung = "*"
level = "requires_adapter"
source = "nikon_ft1"
kiem_chung = "da_doc_trang"
note = "Mount Adapter FT1: ống ngàm F trên thân Nikon 1 (thông cáo Nikon 2011)."

# ---------------- Sony ----------------
[[rule]]
id = "sony_e_apsc_on_ff"
body_mount = "sony_e"
body_khung = "ff"
lens_mount = "sony_e"
lens_khung = "apsc"
level = "crops_sensor"
source = "sony_e_apsc"
kiem_chung = "da_doc_trang"
note = "Ống E APS-C trên thân FE: chế độ chụp APS-C/Super 35mm (Auto tự chọn theo ống)."

[[rule]]
id = "sony_dt_on_a_ff"
body_mount = "sony_a"
body_khung = "ff"
lens_mount = "sony_a"
lens_khung = "apsc"
level = "crops_sensor"
source = "sony_dt"
kiem_chung = "da_doc_trang"
note = "Ống DT trên thân A full-frame (a99, a900, a850): máy dùng vùng cảm biến cỡ APS-C. Với a900/a850 Sony lưu ý có tối góc trong kính ngắm."

[[rule]]
id = "sony_a_on_e_adapter"
body_mount = "sony_e"
body_khung = "*"
lens_mount = "sony_a"
lens_khung = "*"
level = "requires_adapter"
source = "sony_la_ea"
kiem_chung = "da_doc_trang"
note = "Ngàm chuyển dòng LA-EA của Sony: ống ngàm A trên thân E (trang hỗ trợ Sony nói rõ cho ống DT; suy rộng cho mọi ống ngàm A)."

# ---------------- Olympus / Panasonic ----------------
[[rule]]
id = "four_thirds_on_mft_adapter"
body_mount = "mft"
body_khung = "*"
lens_mount = "four_thirds"
lens_khung = "*"
level = "requires_adapter"
source = "olympus_mmf"
kiem_chung = "da_doc_trang"
note = "Olympus MMF-1/2/3: ống Four Thirds trên thân Micro Four Thirds (thông cáo Olympus)."

# ---------------- Pentax ----------------
[[rule]]
id = "pentax_da_on_k_ff"
body_mount = "pentax_k"
body_khung = "ff"
lens_mount = "pentax_k"
lens_khung = "apsc"
level = "crops_sensor"
source = "pentax_k1_crop"
kiem_chung = "da_doc_trang"
note = "Ống DA trên K-1: chế độ Crop tự chuyển sang khổ APS-C."

# =============================================================================
# LUẬT CHUNG (áp sau luật riêng)
# =============================================================================
[[rule]]
id = "same_mount_lens_covers_body"
body_mount = "*"
body_khung = "*"
lens_mount = "="
lens_khung = "covers_body"    # vòng ảnh ống >= khổ cảm biến thân (ff >= apsc; khac chỉ khớp khac)
level = "compatible_with"
source = ""
kiem_chung = "dinh_nghia"
note = "Cùng ngàm và vòng ảnh của ống phủ hết cảm biến -> lắp trực tiếp, đủ khung (vd ống EF trên Rebel, ống FE trên a6000)."

[[rule]]
id = "same_mount_body_apsc_lens_unknown_khung"
body_mount = "*"
body_khung = "apsc"
lens_mount = "="
lens_khung = "khong_ro"
level = "compatible_with"
source = ""
kiem_chung = "dinh_nghia"
note = "Thân APS-C: ống cùng ngàm, dù FF hay APS-C, đều phủ hết cảm biến."

[[rule]]
id = "same_mount_ff_body_lens_khung_unknown_autocrop"
body_mount = ["nikon_f", "nikon_z", "sony_e", "sony_a", "canon_rf", "pentax_k"]
body_khung = "ff"
lens_mount = "="
lens_khung = "khong_ro"
level = "compatible_with"
crop_unknown = true
source = "nikon_dx_fx, nikon_z_area, sony_e_apsc, sony_dt, canon_rfs, pentax_k1_crop"
kiem_chung = "quyet_dinh_nhom"
note = "QĐ 11 (07/10): thân FF có chế độ cắt khung chính hãng + ống cùng ngàm không rõ khung -> dù ống FF (compatible_with) hay APS-C (crops_sensor) đều lắp trực tiếp, nên M = 1. Ghi mức compatible_with kèm cờ crop_unknown = true ('chưa rõ có cắt khung'). Không áp cho Canon EF (QĐ 8)."

[[rule]]
id = "same_mount_other"
body_mount = "*"
body_khung = "*"
lens_mount = "="
lens_khung = "*"
level = "unknown"
source = ""
kiem_chung = "quyet_dinh_nhom"
note = "Cùng ngàm nhưng không có luật riêng (vd ống APS-C trên thân FF ở ngàm chưa có nguồn như L-mount; hoặc không biết khung thân) -> không chắc."

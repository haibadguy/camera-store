kiem_chung = "quyet_dinh_nhom"
note = "QĐ 11 (07/10): thân FF có chế độ cắt khung chính hãng + ống cùng ngàm không rõ khung -> dù ống FF (compatible_with) hay APS-C (crops_sensor) đều lắp trực tiếp, nên M = 1. Ghi mức compatible_with kèm cờ crop_unknown = true ('chưa rõ có cắt khung'). Không áp cho Canon EF (QĐ 8). Căn cứ: các nguồn của 6 luật crops_sensor ở trên (nikon_dx_fx, nikon_z_area, sony_e_apsc, sony_dt, canon_rfs, pentax_k1_crop) — mang theo các suy rộng của các luật đó."
[[rule.can_cu]]

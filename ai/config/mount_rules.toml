# =============================================================================
# BẢNG LUẬT TƯƠNG THÍCH NGÀM (nội dung 3)
# =============================================================================
# Đọc bởi: ai/pipeline/03_mount_compat.py
#
# Mỗi cặp (thân máy, ống kính) được xếp vào ĐÚNG 1 mức:
#   compatible_with  : lắp trực tiếp, dùng đủ khung hình         -> M = 1
#   crops_sensor     : lắp trực tiếp, ống APS-C trên thân FF, ảnh bị cắt -> M = 1
#   requires_adapter : cần ngàm chuyển CHÍNH HÃNG                -> M = 0
#   incompatible     : không lắp được                            -> M = 0
#   unknown          : không chắc (QĐ 8)                         -> M = 0, đánh dấu ở ma trận riêng,
#                                                                   loại khỏi ràng buộc cứng và CVR
#
# Thân và ống được mô tả bằng 2 thuộc tính (giống file chấm tay, docs/labeling_guide.md):
#   mount : ngàm vật lý (canon_ef, canon_efs, nikon_f, sony_e, ...)
#   khung : ff (full-frame) | apsc | khac (MFT, 4/3, Nikon 1, GFX, APS-H...) | khong_ro
#
# CÁCH ÁP LUẬT
#   1. Duyệt các [[rule]] theo thứ tự trong file; luật ĐẦU TIÊN khớp sẽ quyết định mức.
#   2. Một luật khớp khi: body_mount, body_khung, lens_mount, lens_khung đều khớp.
#      Giá trị "*" khớp mọi thứ. Danh sách ["a","b"] khớp nếu giá trị nằm trong danh sách.
#      "=" ở lens_mount nghĩa là "cùng ngàm với thân".
#   3. Không luật nào khớp -> incompatible (khác ngàm, không có ngàm chuyển chính hãng trong bảng).
#
# MỨC KIỂM CHỨNG (trường kiem_chung)
#   "da_doc_trang"   : đã mở trang chính thức của hãng ngày 07/10/2026, đọc và trích câu khớp với luật (xem [sources.*].trich)
#   "dinh_nghia"     : suy ra từ định nghĩa (cùng ngàm, vòng ảnh lớn hơn cảm biến)
#   "quyet_dinh_nhom": quyết định của nhóm (Nam), kèm lý do
# Bản sao văn bản các trang đã đọc: ai/data/external/rule_sources/ (không đưa lên git).
# =============================================================================

[meta]
version = "0.2"
date = "2026-10-07"
default_level = "incompatible"
khung_order = ["ff", "apsc"]   # ff phủ được apsc; "khac" chỉ khớp với chính nó

# -----------------------------------------------------------------------------
# NGUỒN — tất cả đã mở và đọc ngày 07/10/2026 (curl hoặc trình duyệt), trích nguyên văn câu then chốt
# -----------------------------------------------------------------------------
[sources.canon_efs]
url = "https://asia.canon/en/support/8202262300"
kiem_chung = "da_doc_trang"
trich = "The following models do not support EF-S lenses. EOS-1D X / EOS-1Ds Mark III / EOS-1D Mark IV / ... / EOS 5D Mark III / EOS 5D Mark II / EOS 5D / EOS 6D / EOS 10D / EOS D60 / EOS D30"
ghi_chu = "Danh sách trên trang dừng ở 6D; các thân Canon FF ra sau (5D IV, 5DS, 6D II, 1D X II) không có trong danh sách, áp dụng theo cùng nguyên lý (thân không có ngàm EF-S) — suy rộng."


# =============================================================================
# LUẬT RIÊNG (đặt trước luật chung)
# =============================================================================

# ---------------- Thân máy phim (QĐ 16, đặt ĐẦU TIÊN) ----------------
# body_film = true: chỉ khớp thân có cờ may_phim (mount_detect.py: luật dòng máy có nhãn "[phim]" hoặc tiêu đề ghi "film").
# when_regular_level: luật chỉ áp khi "luật thường" (các luật còn lại, coi thân như máy số) cho một trong các mức này.
#   Cặp mà luật thường cho incompatible (khác ngàm, vd thân Nikon F phim + ống Canon EF; ống EF-S trên thân EF phim)
#   KHÔNG khớp luật này -> rơi xuống các luật dưới và giữ incompatible. Cặp luật thường cho unknown cũng giữ unknown
#   (theo luật thường đó).
# Luật không có trường body_film thì khớp mọi thân.
[[rule]]
id = "film_body_unknown"
body_film = true
body_mount = "*"
body_khung = "*"
lens_mount = "*"
lens_khung = "*"
when_regular_level = ["compatible_with", "crops_sensor", "requires_adapter"]
level = "unknown"
kiem_chung = "quyet_dinh_nhom"
note = "QĐ 16 (Nam, 08/10/2026; sửa cùng ngày theo Red Team T4): cặp (thân máy phim, ống) mà luật thường cho lắp được (M = 1) hoặc cần ngàm chuyển chính hãng thì xếp 'không biết' -> loại khỏi M và CVR, vẫn giữ trong đồ thị. Cặp mà luật thường cho 'không lắp được' (khác ngàm, hoặc ống EF-S trên thân EF) thì giữ 'không lắp được': máy phim hay máy số đều không lắp được. Bản đầu (áp cho mọi cặp) làm 14.123 cặp khác ngàm thành 'không biết' (Red Team T4, log ai/data/survey/run_redteam_n3_t4.log)."
nhan_dinh_nhom = [
  "Nhiều ống đời mới không lấy nét (motor trong ống, giao tiếp điện tử) hoặc không chỉnh được khẩu độ (ống không có vòng khẩu) trên máy phim: chưa lưu nguồn hãng cho từng cặp; đây là lý do để xếp 'không biết' thay vì 'lắp được'.",
]
[[rule.can_cu]]
source = "sigma_dc"
kiem_chung = "da_doc_trang"
trich = "Not for use on digital cameras having image sensors larger than APS-C size or on 35mm or APS film cameras, as vignetting will occur."
ghi_chu = "Căn cứ hãng cho ống APS-C trên máy phim 35mm: Sigma ghi rõ không dùng trên máy phim 35mm / APS vì tối góc (v0.4 trích cắt mất cụm 'or on 35mm or APS film cameras'). Chỉ là căn cứ cho ống APS-C (Sigma DC), không cho ống FF."

# ---------------- Canon EF / EF-S (DSLR) ----------------
[[rule]]
id = "canon_efs_on_ef_body"
body_mount = "canon_ef"
body_khung = "*"
lens_mount = "canon_efs"
lens_khung = "*"
level = "incompatible"
kiem_chung = "da_doc_trang"
note = "Ống EF-S không lắp được thân chỉ có ngàm EF (FF 5D/6D/1D X, APS-H 1D Mk I-IV, APS-C đời đầu 10D/D30/D60): ống EF-S có cấu tạo cơ khí để không gắn được lên thân không tương thích."
suy_rong = [
  "Danh sách thân không nhận EF-S trên trang Canon (cập nhật 23/02/2015) dừng ở EOS-1D X / 5D Mark III / 6D. Các thân Canon ngàm EF ra sau (5D Mark IV, 5DS / 5DS R, 6D Mark II, 1D X Mark II / III) được áp cùng luật theo nguyên lý 'thân không có ngàm EF-S' — suy rộng, trang không liệt kê.",
]
nhan_dinh_nhom = [
  "v0.4 ghi lý do 'phần sau ống chạm gương': trang Canon KHÔNG nói vậy (chỉ nói ống EF-S có back focus ngắn hơn và có cấu tạo cơ khí để không gắn được). Tìm 08/10/2026 chỉ thấy bài diễn đàn Canon Community, không có trang hãng -> đã bỏ khỏi lý do.",
]
[[rule.can_cu]]
source = "canon_efs"
kiem_chung = "da_doc_trang"
trich = "The following models do not support EF-S lenses."
[[rule.can_cu]]
source = "canon_efs"
kiem_chung = "da_doc_trang"
trich = "EOS 5D Mark III / EOS 5D Mark II / EOS 5D / EOS 6D /EOS 10D / EOS D60 / EOS D30"
ghi_chu = "Phần cuối danh sách thân không nhận EF-S (đầu danh sách: EOS-1D X / EOS-1Ds Mark III / ... / EOS-1D)."
[[rule.can_cu]]
source = "canon_efs"
kiem_chung = "da_doc_trang"
trich = "EF-S lenses have a mechanical configuration that makes it so that they cannot be mounted on cameras that are not compatible with ES-S lenses."

[[rule]]
id = "canon_ef_apsc_on_ef_ff_body"
body_mount = "canon_ef"
body_khung = ["ff", "khac"]
lens_mount = "canon_ef"
lens_khung = ["apsc", "khong_ro"]
level = "unknown"
kiem_chung = "quyet_dinh_nhom"
note = "QĐ 8 (07/10): ống APS-C hãng thứ ba ngàm EF (Sigma DC, Tamron Di II...) trên thân Canon FF/APS-H lắp vật lý được nhưng tối góc; Sigma ghi 'not for use' trên cảm biến lớn hơn APS-C. khong_ro cũng xếp unknown vì không biết vòng ảnh."
suy_rong = [
  "Trang Sigma chỉ nói về MỘT ống (17-50mm F2.8 EX DC OS HSM). Áp cho mọi ống APS-C hãng thứ ba ngàm EF (Sigma DC khác, Tamron Di II, Tokina DX...) là suy rộng.",
]
nhan_dinh_nhom = [
  "v0.4 ghi 'DSLR Canon FF không tự cắt khung': không tìm được trang hãng nói điều này (tìm 08/10/2026 chỉ thấy bài diễn đàn) -> đã bỏ khỏi lý do. Lý do còn lại là nguồn Sigma ('not for use', tối góc).",
]
[[rule.can_cu]]
source = "sigma_dc"
kiem_chung = "da_doc_trang"
trich = "DC lenses have an image circle that covers APS-C size image sensors."
[[rule.can_cu]]
source = "sigma_dc"
kiem_chung = "da_doc_trang"
trich = "Not for use on digital cameras having image sensors larger than APS-C size or on 35mm or APS film cameras, as vignetting will occur."
[[rule.can_cu]]
source = "sigma_dc"
kiem_chung = "da_doc_trang"
trich = "SIGMA SA-mount,Canon EF mount,Nikon F mount,Pentax mount,Sony A-mount"
ghi_chu = "Ống DC bản Canon dùng ngàm EF (không phải EF-S) — điểm 'chưa đối chiếu' của QĐ 8."

[[rule]]
id = "canon_ef_efs_on_efs_body"
body_mount = "canon_efs"
body_khung = "*"
lens_mount = ["canon_ef", "canon_efs"]
lens_khung = "*"
level = "compatible_with"
kiem_chung = "da_doc_trang"
note = "Thân Canon APS-C có ngàm EF-S nhận cả ống EF và EF-S."
suy_rong = [
  "Danh sách thân TƯƠNG THÍCH EF-S trên trang Canon (cập nhật 23/02/2015) dừng ở đời 2015 (7D Mark II, 70D, Rebel T5i/T5, M3...). Các thân Canon APS-C ngàm EF-S ra sau (80D, 90D, 77D, Rebel T6i/T7i/T7/SL2/SL3...) được áp cùng luật — suy rộng, trang không liệt kê.",
  "Câu trích không nói trực tiếp 'thân EF-S nhận ống EF'; điều này suy từ việc ống EF có mốc gắn riêng (chấm đỏ) trên cùng thân — xem căn cứ thứ 3.",
]
[[rule.can_cu]]
source = "canon_efs"
kiem_chung = "da_doc_trang"
trich = "The following cameras are compatible with EF-S lenses:"
[[rule.can_cu]]
source = "canon_efs"
kiem_chung = "da_doc_trang"
trich = "EOS 7D Mark II / EOS 7D / EOS 70D / EOS 60D / EOS 60Da / EOS 50D / EOS 40D / EOS 30D / EOS 20D / EOS 20Da"
ghi_chu = "Phần đầu danh sách thân tương thích EF-S."
[[rule.can_cu]]
source = "canon_efs"
kiem_chung = "da_doc_trang"
trich = "When attaching EF-S lenses to the camera body, align them with the white, square mount index. EF lenses should be aligned with the red, round mount index."


# =============================================================================
# BẢNG LUẬT TƯƠNG THÍCH NGÀM (nội dung 3)
# =============================================================================
# Đọc bởi: ai/pipeline/03_mount_compat.py
# Kiểm nguồn và câu trích: ai/survey/content3/check_rule_sources.py (theo chuẩn QĐ nội dung 4 – 15)
#
# Mỗi cặp (thân máy, ống kính) được xếp vào ĐÚNG 1 mức:
#   compatible_with  : lắp trực tiếp, dùng đủ khung hình         -> M = 1
#   crops_sensor     : lắp trực tiếp, ống APS-C trên thân FF, ảnh bị cắt -> M = 1
#   requires_adapter : cần ngàm chuyển CHÍNH HÃNG                -> M = 0
#   incompatible     : không lắp được                            -> M = 0
#   unknown          : không chắc (QĐ 8)                         -> M = 0, đánh dấu ở ma trận riêng,
#                                                                   loại khỏi ràng buộc cứng và CVR
#
# Thân và ống được mô tả bằng 2 thuộc tính (giống file chấm tay, docs/labeling_guide.md):
#   mount : ngàm vật lý (canon_ef, canon_efs, nikon_f, sony_e, ...)
#   khung : ff (full-frame) | apsc | khac (MFT, 4/3, Nikon 1, GFX, APS-H...) | khong_ro
#   Khung ống Sony có mã SEL/SAL: xem ai/config/sony_lens_codes.toml (Red Team T2).
#
# CÁCH ÁP LUẬT
#   1. Duyệt các [[rule]] theo thứ tự trong file; luật ĐẦU TIÊN khớp sẽ quyết định mức.
#   2. Một luật khớp khi: body_mount, body_khung, lens_mount, lens_khung đều khớp.
#      Giá trị "*" khớp mọi thứ. Danh sách ["a","b"] khớp nếu giá trị nằm trong danh sách.
#      "=" ở lens_mount nghĩa là "cùng ngàm với thân".
#      Trường tùy chọn: body_film (chỉ khớp thân máy phim / máy số), when_regular_level (xem luật film_body_unknown).
#   3. Không luật nào khớp -> incompatible (khác ngàm, không có ngàm chuyển chính hãng trong bảng).
#   Các trường can_cu, suy_rong, nhan_dinh_nhom, note CHỈ để ghi nguồn / lý do; script 03 không đọc.
#
# CHUẨN NGUỒN (QĐ nội dung 4 – 15, áp cho nội dung 3 từ v0.5 theo Red Team T5)
#   [sources.*]  : mỗi trang nguồn có bản sao lưu (đường dẫn tính từ meta.thu_muc_ban_sao, không đưa lên git):
#     ban_sao / sha256_html      : bản HTML CHÍNH để kiểm câu trích
#     ban_sao_txt / sha256_txt   : văn bản trích từ ban_sao bằng ai/survey/content4/html_to_text.py
#     dau_hieu_bai               : một câu có trong phần nội dung bài (để chắc bản sao không phải trang lỗi / trang chặn)
#     cach_luu                   : curl trực tiếp / bản Wayback thô (id_) / Nam lưu bằng trình duyệt; kèm ngày
#   [[rule.can_cu]] : danh sách căn cứ của luật, mỗi căn cứ = 1 nguồn + 1 câu trích NGUYÊN VĂN, liền một đoạn
#                     (không ghép các câu ở các mục khác nhau bằng "..."; câu ở chỗ khác thì tách thành căn cứ riêng).
#   suy_rong       : chỗ luật áp RỘNG HƠN điều nguồn nói (Red Team T5 nêu 6 chỗ; ghi đủ ở từng luật).
#   nhan_dinh_nhom : khẳng định trong lý do mà KHÔNG tìm được nguồn hãng (ghi rõ, không dùng làm căn cứ).
#
# MỨC KIỂM CHỨNG (trường kiem_chung của luật và của từng căn cứ)
#   "da_doc_trang"   : câu trích có trong bản sao đã lưu (script kiểm OK). Luật da_doc_trang cần >= 1 căn cứ OK.
#   "dinh_nghia"     : suy ra từ định nghĩa (cùng ngàm, vòng ảnh lớn hơn cảm biến)
#   "quyet_dinh_nhom": quyết định của nhóm (Nam), kèm lý do; căn cứ (nếu có) chỉ hỗ trợ một phần lý do
# =============================================================================

[meta]
version = "0.5"
date = "2026-10-08"
default_level = "incompatible"
khung_order = ["ff", "apsc"]   # ff phủ được apsc; "khac" chỉ khớp với chính nó
thu_muc_ban_sao = "ai/data/external/"
lich_su = """v0.4 -> v0.5 (08/10/2026, Red Team nội dung 3 lần 1: T5, T2, N1): áp chuẩn nguồn QĐ 4-15 (bản sao + sha256 + script kiểm);
sửa 2 câu trích không nguyên văn (Nikon DX/FX ghép 2 mục; Ricoh thiếu '★'); ghi 6 chỗ suy rộng; bỏ 3 khẳng định không nguồn khỏi lý do;
thêm cụm Sigma về máy phim làm căn cứ cho QĐ 16; thêm luật Pentax Adapter Q và Fujifilm M Mount Adapter; khung ống Sony qua bảng mã.
Bản 07/10 ở ai/data/external/rule_sources/*.html: 4 trang là trang lỗi 'Access Denied' (Canon Europe x2, Sony x2), 1 trang chặn bot
(Olympus/OM System) và sony_la_ea rỗng -> nay thay bằng bản Wayback / bản Nam lưu tay."""


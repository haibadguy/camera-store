kiem_chung = "da_doc_trang"
trich = "The standard Mount Adapter EF-EOS R allows EF-S and EF lenses to be used on EOS R cameras seamlessly."

[sources.canon_rfs]
url = "https://snapshot.asia.canon/en/article/whats-the-difference-between-rf-s-and-rf-lenses"
kiem_chung = "da_doc_trang"
trich = "your EOS R series full-frame camera automatically switches to 1.6x crop mode when it detects that an RF-S lens is attached."

[sources.canon_ef_eos_m]

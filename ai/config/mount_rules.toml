kiem_chung = "da_doc_trang"
trich = "Attach any lens from Canon's huge range of EF and EF-S lenses to the EOS M ... using this small, lightweight EF-M mount adaptor."

[sources.nikon_dx_fx]
url = "https://www.nikonusa.com/learn-and-explore/c/products-and-innovation/the-dx-and-fx-formats"
kiem_chung = "da_doc_trang"
trich = "On a full frame FX-format camera with a DX lens mounted, the camera will automatically engage its built-in DX crop mode ... DX lenses and FX lenses can be used interchangeably."

[sources.nikon_z_area]
url = "https://onlinemanual.nikonimglib.com/zf/en/image_area_quality_and_size_31.html"
kiem_chung = "da_doc_trang"
trich = "Image-area selection is fixed at [ DX (24x16) ] when a DX lens is attached. (hướng dẫn sử dụng Nikon Zf)"

[sources.nikon_ftz]
url = "https://imaging.nikon.com/imaging/lineup/accessory/camera/ftz_2/"
kiem_chung = "da_doc_trang"
trich = "The Mount Adapter FTZ II ensures continued use of the rich variety of NIKKOR F lenses seamlessly with the Nikon Z series cameras"

[sources.nikon_ft1]
url = "https://www.nikon.com/company/news/2011/0921_acc_03/"
kiem_chung = "da_doc_trang"
trich = "The Mount Adapter FT1 is a mount adapter that enables the use of F-mount lenses with Nikon 1 system cameras."
ghi_chu = "Thay URL bán lẻ (B&H) bằng thông cáo của Nikon; trang B&H bật kiểm tra chống bot nên không đọc."

[sources.sony_e_apsc]
url = "https://www.sony.ca/en/electronics/support/articles/00268906"
kiem_chung = "da_doc_trang"
trich = "Using APS-C lenses with full frame cameras: The shooting size can be set on the camera. The default setting is Auto. ... Auto: Recording sizes are automatically determined by lens and camera settings."

[sources.sony_dt]
url = "https://www.sony.ca/en/electronics/support/articles/00029993"
kiem_chung = "da_doc_trang"
trich = "When a DT lens is attached to a full-frame digital camera ... The camera will only use part of the image sensor that is equivalent in size to an APS-C sensor. The image size is automatically set to that of the APS-C size setting."

[sources.sony_la_ea]
url = "https://www.sony.ca/en/electronics/support/articles/00029993"
kiem_chung = "da_doc_trang"
trich = "Note: When mounting a DT lens on an E-mount camera, a LA-EA series lens mount adapter is required."
ghi_chu = "Thay URL bán lẻ (B&H) bằng trang hỗ trợ Sony. Câu trích nói về ống DT (ngàm A); suy rộng cho mọi ống ngàm A trên thân E (dòng LA-EA là ngàm chuyển A->E)."

[sources.olympus_mmf]
url = "https://www.olympus-global.com/en/news/2009b/nr091112ep2e.html"
kiem_chung = "da_doc_trang"
trich = "The system works with all Micro Four Thirds System lenses, and - via an optional MMF-1 Four Thirds Mount Adapter - all Four Thirds System lenses."
ghi_chu = "Thay URL bán lẻ (B&H) bằng thông cáo của Olympus (giới thiệu PEN E-P2). Trang MMF-3 của OM System không mở được (trình duyệt chặn, curl không kết nối)."

[sources.pentax_k1_crop]
url = "https://www.ricoh-imaging.co.jp/english/products/k-1/feature/04.html"
kiem_chung = "da_doc_trang"

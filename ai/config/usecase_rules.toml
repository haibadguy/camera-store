# =============================================================================
# LUẬT MỤC ĐÍCH SỬ DỤNG (nội dung 4, quan hệ suitable_for: ống -> usecase)
# =============================================================================
# Đọc bởi: ai/survey/content4/count_usecase.py   (v0.2, 08/10/2026, Nam đã duyệt các quyết định ở QĐ 4-11 .. 4-15)
#
# ĐÂY LÀ QUY TẮC DO NHÓM TỰ ĐẶT, dựa trên khuyến nghị trong tài liệu của hãng (Canon, Nikon).
# Không phải nhãn thật, nên không đo được độ chính xác (STATUS mục 4, hạn chế nội dung 4).
#
# PHẠM VI
#   - Chỉ gắn cho ống kính (item_type = "ong") đọc được cả tiêu cự lẫn khẩu độ từ tiêu đề
#     (eval_external.lens_sig(head_main(title)); độ chính xác của bước đọc này đo ở việc 2).
#   - Thân máy không có nhãn mục đích.
#   - Nhãn gắn theo KHỔ MÀ ỐNG ĐƯỢC THIẾT KẾ CHO, không theo thân của người dùng (QĐ 4-4).
#   - 4 nhãn: chan_dung, phong_canh, the_thao_chim, macro. Nhãn vlog ĐÃ BỎ (QĐ 4-11).
#
# TIÊU CỰ QUY ĐỔI 35mm — chỉ dùng trong file này (QĐ 4-1)
#   lo_eq = tiêu cự ngắn nhất x hệ số crop; hi_eq = tiêu cự dài nhất x hệ số crop (ống một tiêu cự: lo = hi).
#   Ống không rõ khổ: tính với MỌI hệ số trong crop.khong_ro (1,0 và 1,6), chỉ gắn nhãn khi mọi cách tính
#   cùng cho ra nhãn đó (giao) — đúng thiết kế (content4_design mục 3.2).
#
# BẢN SAO NGUỒN (thư mục gốc: ai/data/external/usecase_sources/, không đưa lên git)
#   ban_sao      : bản HTML CHÍNH để kiểm câu trích; sha256 ghi ở sha256_html
#   ban_sao_txt  : văn bản trích từ ban_sao bằng ai/survey/content4/html_to_text.py; sha256 ở sha256_txt
#   ban_phu      : bản phụ công khai (Wayback), chỉ để đối chiếu, KHÔNG dùng để kiểm câu trích
#   dau_hieu_bai : một câu có trong phần nội dung bài; script kiểm có trong ban_sao_txt để chắc bản sao
#                  không phải trang rỗng / trang lỗi / chỉ có hộp cookie
#
# MỨC KIỂM CHỨNG CỦA MỖI CĂN CỨ (trong [[rules.*.can_cu]])
#   "da_doc_trang"   : câu trích lấy từ bản sao đã lưu, script kiểm thấy có (OK)
#   "quyet_dinh_nhom": nhóm tự chọn con số, nguồn chỉ nói định tính; ghi lý do
# Mỗi luật phải có ít nhất 1 căn cứ "da_doc_trang" mà script báo OK.
# =============================================================================

[meta]
version = "0.2"
date = "2026-10-08"

# -----------------------------------------------------------------------------
# HỆ SỐ CROP THEO KHỔ ỐNG (định nghĩa: đường chéo full-frame / đường chéo cảm biến)
# -----------------------------------------------------------------------------
[crop]
ff = 1.0
apsc_canon = 1.6        # canon_eu_beginner: "In Canon cameras, the "crop factor" is 1.6x"
apsc_khac = 1.5         # Nikon DX, Sony, Fuji X, Pentax; nikon_85_f18g: 85mm trên DX ~ 127mm
aps_h = 1.3             # ống khung "khac" ngàm canon_ef (APS-H)
khong_ro = [1.0, 1.6]   # khổ không rõ: tính cả hai, giữ phần nhãn chung
[crop.theo_ngam]        # khổ cố định theo ngàm, ưu tiên hơn cột khung
mft = 2.0
four_thirds = 2.0
nikon_1 = 2.7
pentax_q = 5.5
fuji_g = 0.79


# =============================================================================
# LUẬT
# =============================================================================
# Ký hiệu: lo_eq, hi_eq (tiêu cự quy đổi, mm); ap_tele = khẩu độ ở đầu tele (ống một tiêu cự: khẩu độ duy nhất).
# Một ống có thể có nhiều nhãn hoặc không nhãn nào.

[rules.phong_canh]
ten = "phong cảnh"
lo_eq_max = 35                       # lo_eq <= 35
note = "Ống phủ được vùng góc rộng (<= ~35mm quy đổi)."
[[rules.phong_canh.can_cu]]
source = "canon_eu_beginner"
kiem_chung = "da_doc_trang"
trich = "Wide-angle lenses – those up to around 35mm – will include more of the scene you're photographing, making them ideal for landscape photography"
[[rules.phong_canh.can_cu]]
source = "canon_us_lens_guide"
kiem_chung = "da_doc_trang"
trich = "Wide-Angle 8-35mm ... Often used for interiors, landscapes"
[[rules.phong_canh.can_cu]]
source = "canon_eu_wildlife"
kiem_chung = "da_doc_trang"
trich = "a wide-angle lens – usually defined as one with a focal length of 35mm or less"
[[rules.phong_canh.can_cu]]
source = "canon_us_wide_angle"
kiem_chung = "da_doc_trang"
trich = "a wide-angle lens was considered a lens with a focal length of about 35mm, or lower"
[[rules.phong_canh.can_cu]]
source = "canon_eu_landscape"
kiem_chung = "da_doc_trang"
trich = "For classic expansive landscape images ... you'll need a wide-angle lens"

[rules.the_thao_chim]
ten = "thể thao / chim"
hi_eq_min = 300                      # hi_eq >= 300
note = "canon_eu_beginner nói 'above 300mm' (> 300), hai trang kia nói 'at least 300' / '300mm-plus' (>= 300); chọn >= 300. Chỉ canon_eu_beginner nhắc tới thể thao."
[[rules.the_thao_chim.can_cu]]
source = "canon_eu_beginner"
kiem_chung = "da_doc_trang"
trich = "Lenses above 300mm ... are typically used in genres such as wildlife and sports/action photography"
[[rules.the_thao_chim.can_cu]]
source = "canon_us_wildlife"
kiem_chung = "da_doc_trang"
trich = "At a minimum, select a lens with at least a 300mm focal length"
[[rules.the_thao_chim.can_cu]]
source = "canon_us_wildlife"
kiem_chung = "da_doc_trang"
trich = "It covers the same area that a 480mm lens would on a full-frame camera (300 x 1.6 = 480mm)."
ghi_chu = "Căn cứ để so 300mm với tiêu cự QUY ĐỔI."
[[rules.the_thao_chim.can_cu]]
source = "canon_eu_wildlife"
kiem_chung = "da_doc_trang"
trich = "super-telephoto (300mm-plus) range"

[rules.chan_dung]
ten = "chân dung"
eq_overlap = [85, 135]               # phủ ít nhất một tiêu cự quy đổi trong [85, 135]: lo_eq <= 135 và hi_eq >= 85
ap_tele_max = 2.8                    # khẩu độ ở đầu tele <= f/2.8
note = "Mốc dưới 85 theo nguồn (QĐ 4-12). Mốc trên 135 và ngưỡng f/2.8 là QUYẾT ĐỊNH NHÓM (QĐ 4-13): nguồn chỉ nói '85mm or longer' (không giới hạn trên) và chỉ nói định tính rằng khẩu độ lớn giúp xóa phông."
[[rules.chan_dung.can_cu]]
source = "canon_eu_portrait"
kiem_chung = "da_doc_trang"
trich = "Typically, a portrait lens refers to a lens with a focal length of around 85mm or longer"
[[rules.chan_dung.can_cu]]
source = "canon_eu_portrait"
kiem_chung = "da_doc_trang"
trich = "What primarily sets a portrait lens apart is the focal length and maximum aperture"
[[rules.chan_dung.can_cu]]
source = "nikon_85_f18g"
kiem_chung = "da_doc_trang"
trich = "Fast aperture, medium telephoto portrait lens"
[[rules.chan_dung.can_cu]]
source = "canon_eu_beginner"
kiem_chung = "quyet_dinh_nhom"
trich = "With zoom lenses, selecting a lens with a reasonably wide maximum aperture, such as f/2.8"
ghi_chu = "Nguồn chỉ lấy f/2.8 làm ví dụ 'khẩu độ khá rộng' cho zoom, không nói về chân dung -> ngưỡng f/2.8 là quyết định nhóm. Mốc trên 135mm: không có nguồn."

[rules.macro]
ten = "macro"
tu_khoa = '\b(?:macro|makro)\b|\bmicro[- ]?nikkor\b'      # tìm trong phần chủ thể tiêu đề (head_main), không phân biệt hoa thường
chi_ong_mot_tieu_cu = true           # zoom ghi "Macro" KHÔNG tính
note = """Định nghĩa theo nguồn: ống macro đạt độ phóng đại >= 0,5x (1:2). Tiêu đề Amazon không có độ phóng đại nên dùng dấu hiệu
thay thế (QUYẾT ĐỊNH NHÓM, QĐ 4-14): ống một tiêu cự có chữ Macro / Makro / Micro-Nikkor trong phần chủ thể tiêu đề.
'micro' chỉ tính khi đi với 'nikkor', để không bắt 'Micro Four Thirds'.
Sai đã biết, THEO MÔ TẢ AMAZON, CHƯA KIỂM BẰNG TRANG HÃNG: Sigma 24mm f/1.8 và 28mm f/1.8 'Macro' chỉ khoảng 1:2,7 nhưng vẫn được gắn
nhãn; Sigma 70-300mm DG Macro và Tamron 70-300mm Di LD Macro đạt 1:2 nhưng bị bỏ sót vì là zoom."""
[[rules.macro.can_cu]]
source = "canon_eu_beginner"
kiem_chung = "da_doc_trang"
trich = "a macro lens – one with MACRO in its name – will help with a close minimum focusing distance and a magnification of 0.5x or more"
[[rules.macro.can_cu]]
source = "nikon_macro"
kiem_chung = "da_doc_trang"
trich = "A true macro lens—Nikon's designation is Micro-NIKKOR—allows you to you take photographs that are 1:2 or 1:1 reproduction"

# -----------------------------------------------------------------------------
# NHÃN ĐÃ BỎ — chỉ đếm đối chiếu trong log, KHÔNG sinh cạnh
# -----------------------------------------------------------------------------
[rules.vlog]
ten = "vlog"
trang_thai = "da_bo"
lo_eq_max_tham_khao = 24

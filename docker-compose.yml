services:
  postgres:
    image: postgres:17-alpine
    container_name: camera-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: camera_store
      POSTGRES_USER: camera
      POSTGRES_PASSWORD: camera123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: camera-store-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: camera-store-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/camera_store
      DATABASE_USERNAME: camera
      DATABASE_PASSWORD: camera123
      PORT: 8080
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: camera-store-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:

